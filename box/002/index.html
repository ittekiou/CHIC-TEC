<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIC TEC｜私書箱</title>
<style>
  body { margin:0; background:#000; color:#f2f2f2; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif; line-height:1.8; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; text-align:center; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:#a8a8a8; margin:6px 0; }
  a { color:#6aa8f0; }
  ul { list-style:none; padding:0; margin:20px 0; }
  li { margin:8px 0; }
  .foot { font-size:12px; color:#5c5c5c; margin-top:32px; }
  .foot a { color:#a8a8a8; }
</style>
</head>
<body>
<main>
  <h1 id="n">私書箱</h1>
  <p id="a"></p>
  <ul id="l"></ul>
  <p class="foot">CHIC TEC｜繭topia ── DyXis の私書箱（P.O. Box）<br>
  <a href="https://github.com/ittekiou/CHIC-TEC">CHIC TEC</a> ・ <a href="https://ittekiou.github.io/dyxis/">DyXis</a></p>
</main>
<script>
fetch("nest.json", { cache: "no-store" }).then(r => r.json()).then(j => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  document.title = j.name + "｜CHIC TEC";
  document.getElementById("n").textContent = j.name;
  document.getElementById("a").textContent = j.about || "";
  const items = [...(j.links || []).map(x => [x.title, x.url]),
                 ...(j.nests || []).filter(x => !/CHIC-TEC\/$/.test(x.url)).map(x => ["↩️ " + x.name, x.url])];
  document.getElementById("l").innerHTML = items.map(([t, u]) => `<li><a href="${esc(u)}">${esc(t)}</a></li>`).join("");
}).catch(() => {});
</script>
</body>
</html>
