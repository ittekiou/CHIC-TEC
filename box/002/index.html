<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHIC TEC｜私書箱</title>
<link rel="icon" type="image/png" href="/CHIC-TEC/favicon.png">
<link rel="apple-touch-icon" href="/CHIC-TEC/apple-touch-icon.png">
<style>
  body { margin:0; background:#000; color:#f2f2f2; font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Hiragino Sans",sans-serif; line-height:1.8; }
  main { max-width:560px; margin:0 auto; padding:48px 16px; text-align:center; }
  p { color:#a8a8a8; margin:6px 0; }
  a { color:#6aa8f0; }
  ul { list-style:none; padding:0; margin:24px 0 0; display:flex; flex-wrap:wrap; justify-content:center; gap:4px 18px; }
  li { margin:0; font-size:15px; }
  .foot { font-size:12px; color:#5c5c5c; margin-top:32px; }
  .foot a { color:#a8a8a8; }

  /* 扉：表札の中身を扉に書き、扉ごと押すと中へ */
  .door { position:relative; display:block; width:min(250px, 76vw); box-sizing:border-box; min-height:400px; margin:0 auto; padding:120px 34px 70px;
          border-radius:125px 125px 8px 8px; text-decoration:none; color:inherit;
          background:linear-gradient(160deg, #6b4a32, #4a3222); border:3px solid #2b1c12;
          box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), 0 8px 24px rgba(0,0,0,.6);
          transition: transform .25s ease, box-shadow .25s ease; }
  .door::after { content:""; position:absolute; right:22px; top:62%; width:14px; height:14px; border-radius:50%;
                 background:radial-gradient(circle at 35% 35%, #f6dc8c, #b8892c); }
  .door .plate { display:inline-block; background:#f3eee6; color:#2b2622; border-radius:5px; padding:7px 12px;
                 box-shadow:0 2px 0 rgba(0,0,0,.35); max-width:100%; }
  .door h1 { font-size:18px; margin:0; line-height:1.4; }
  .door .about { color:#7a7068; font-size:11.5px; line-height:1.6; margin:4px 0 0; }
  .door .knock { position:absolute; left:0; right:0; bottom:20px; font-size:15px; color:#f3e3c8; }
  .door.open:hover { transform:perspective(600px) rotateY(-12deg); box-shadow: inset 0 0 0 10px rgba(0,0,0,.18), 0 10px 30px rgba(233,185,73,.25); }
  .door.closed { background:linear-gradient(160deg, #4b4440, #322c29); }
  .door.closed:hover { transform:translateY(-2px); }
  .door.plain { cursor:default; }
</style>
</head>
<body>
<main>
  <a class="door plain" id="door"><span class="plate"><h1 id="n">私書箱</h1><p class="about" id="a"></p></span><span class="knock" id="k"></span></a>
  <ul id="l"></ul>
  <p class="foot">CHIC TEC｜繭topia ── DyXis の私書箱（P.O. Box）<br>
  <a href="https://ittekiou.github.io/CHIC-TEC/">CHIC TEC</a> ・ <a href="https://ittekiou.github.io/dyxis/">DyXis</a></p>
</main>
<script>
fetch("nest.json", { cache: "no-store" }).then(r => r.json()).then(j => {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
  document.title = j.name + "｜CHIC TEC";
  document.getElementById("n").textContent = j.name;
  document.getElementById("a").textContent = j.about || "";

  // 札のリンクに「集卵処」があれば開いた扉（中の庭へ）。なければ「借りる」へ向かう閉じた扉
  const links = j.links || [];
  const garden = links.find(x => /集卵処/.test(x.title));
  const rent = links.find(x => /借りる/.test(x.title));
  const door = document.getElementById("door"), k = document.getElementById("k");
  const used = garden || rent;
  if (garden) { door.href = garden.url; door.className = "door open"; k.textContent = "🚪 どうぞ、庭へ"; }
  else if (rent) { door.href = rent.url; door.className = "door closed"; k.textContent = "🈳 空室｜借りる"; }

  const items = [...links.filter(x => x !== used).map(x => [x.title, x.url]),
                 ...(j.nests || []).filter(x => !/CHIC-TEC\/$/.test(x.url)).map(x => ["↩️ " + x.name, x.url])];
  document.getElementById("l").innerHTML = items.map(([t, u]) => `<li><a href="${esc(u)}">${esc(t)}</a></li>`).join("");
}).catch(() => {});
</script>
</body>
</html>
