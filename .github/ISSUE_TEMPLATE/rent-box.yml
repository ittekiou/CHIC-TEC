name: 私書箱を借りる / Rent a P.O. Box
description: CHIC TEC の私書箱に、あなたの名札を一枚置きます。
title: "[借りる] "
labels: ["借りる"]
body:
  - type: markdown
    attributes:
      value: |
        私書箱に置くのは名札一枚だけです（名前・自己紹介・リンク・RSS）。本文は、あなた自身の場所に。
        書いた内容は公開されます。
        すでに自分の巣（nest.json）がある方は、私書箱は要りません。DyXis に直接載せてもらえます。
        私書箱を借りたあとで自分の巣を置いたら、「巣立つ・外す」で知らせてください。
        期間限定（6か月）。
  - type: input
    id: nest_name
    attributes:
      label: 名札の名前 / Name
    validations:
      required: true
  - type: input
    id: about
    attributes:
      label: 一行の自己紹介 / About (one line)
    validations:
      required: true
  - type: input
    id: home_url
    attributes:
      label: 本拠地のリンク（ブログ・note など）/ Your home URL
      placeholder: https://note.com/...
    validations:
      required: true
  - type: input
    id: rss
    attributes:
      label: RSS（わかれば）/ RSS feed (optional)
      placeholder: https://note.com/.../rss
  - type: dropdown
    id: forward
    attributes:
      label: 巣立つとき、転送先を名札に書きますか？ / Show your new address when you move?
      options:
        - はい / Yes
        - いいえ / No
        - そのとき決める / Decide later
    validations:
      required: true
  - type: checkboxes
    id: agree
    attributes:
      label: 確認 / Confirm
      options:
        - label: 会則（期間限定・名札一枚・履歴は残る）を読みました / I have read the rules
          required: true
